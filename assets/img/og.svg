<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E0E0C"/>
      <stop offset="1" stop-color="#161613"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#FF5B1F" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FF5B1F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <rect width="56" height="56" rx="14" fill="#FAF8F4"/>
    <circle cx="28" cy="28" r="10" fill="#FF5B1F"/>
  </g>
  <text x="156" y="123" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#FAF8F4">BistroFlow</text>

  <!-- Headline -->
  <text x="80" y="320" font-family="Inter, sans-serif" font-size="78" font-weight="800" fill="#FAF8F4" letter-spacing="-3">
    <tspan x="80" dy="0">Eu sou Bistro,</tspan>
    <tspan x="80" dy="90">sua última contratação.</tspan>
  </text>
  <text x="80" y="540" font-family="Inter, sans-serif" font-size="28" font-weight="500" fill="rgba(250,248,244,0.7)">
    Automação inteligente para restaurantes · 24/7
  </text>

  <!-- URL -->
  <text x="1120" y="600" text-anchor="end" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FF5B1F">
    bistroflow.app
  </text>
</svg>
